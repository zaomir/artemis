# Artemis — nginx 410 snippet for legacy investment static assets
# Final: merge into /etc/nginx/sites-available/artemisresort.com
# BEFORE the existing `location /static/` alias block (order matters).
# Do NOT apply blindly; test with `nginx -t` and reload.
#
# Context: Flask returns 410 for app routes (/download-pdf, /calculator, …).
# Nginx serves /static/ via alias and bypasses Flask — PDFs need explicit 410 here.

# --- BEGIN ARTEMIS 410 (Lane B) ---
location = /static/Artemis_Resort_Investment.pdf {
    return 410;
}
location = /static/Artemis_Resort_Investment_Presentation.pdf {
    return 410;
}
location = /static/artemis-investment.pdf {
    return 410;
}
location = /static/presentation.pdf {
    return 410;
}
location = /download-pdf {
    return 410;
}
location = /download-pdf/ {
    return 410;
}
# Optional legacy pretty paths (Flask also aborts 410 if proxied)
location = /calculator {
    return 410;
}
location = /calculator/ {
    return 410;
}
location = /presentation {
    return 410;
}
location = /presentation/ {
    return 410;
}
location = /investor {
    return 410;
}
location = /investor/ {
    return 410;
}
location = /investors {
    return 410;
}
location = /investors/ {
    return 410;
}
# --- END ARTEMIS 410 ---

# Existing static alias should remain AFTER the exact = locations above:
# location /static/ {
#     alias /var/www/artemis/app/static/;
#     ...
# }
