# VPS2402 origin artemisresort.com DEC-785/TASK-778 Phase B
# Versioned copy of /etc/nginx/sites-enabled/artemisresort.com.origin.conf on vps2402 (31.10.2026,
# QA A-08 www -> apex 301 and B-04 single Cache-Control applied live). Edit here, then copy, nginx -t, reload.
server {
    listen 185.216.214.28:443 ssl http2;
    listen 443 ssl http2;
    server_name artemisresort.com;
    server_tokens off;   # QA PR24-04: no nginx version in error pages / Server header
    include /etc/nginx/snippets/artemis-security-headers.conf;
    include /etc/nginx/snippets/cloudflare-realip.conf;

    ssl_certificate /etc/letsencrypt/live/artemisresort.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/artemisresort.com/privkey.pem;
    # include /etc/nginx/fastpanel2-includes/letsencrypt.conf;

    access_log /var/log/nginx/artemisresort.access.log;
    error_log  /var/log/nginx/artemisresort.error.log;


    # ACME HTTP-01 (2026-10-31)
    location ^~ /.well-known/acme-challenge/ { root /var/www/letsencrypt; default_type text/plain; }

    # --- BEGIN ARTEMIS 410 (Final 2026-07-20) ---
    location = /static/Artemis_Resort_Investment.pdf {
        return 410;
    }
    location = /static/Artemis_Resort_Investment_Presentation.pdf {
        return 410;
    }
    location = /static/artemis-investment.pdf {
        return 410;
    }
    location = /static/presentation.pdf {
        return 410;
    }
    location = /download-pdf {
        return 410;
    }
    location = /download-pdf/ {
        return 410;
    }
    location = /calculator {
        return 410;
    }
    location = /calculator/ {
        return 410;
    }
    location = /presentation {
        return 410;
    }
    location = /presentation/ {
        return 410;
    }
    location = /investor {
        return 410;
    }
    location = /investor/ {
        return 410;
    }
    location = /investors {
        return 410;
    }
    location = /investors/ {
        return 410;
    }
    # --- END ARTEMIS 410 ---

    # Content-fingerprinted Tenerife images are immutable. Unversioned CSS/JS/config below still revalidate.
    location ~ "^/static/tenerife/site/img/[a-z0-9-]+-[0-9a-f]{6}(?:-[0-9]+)?\.(?:webp|jpg)$" {
        root /var/www/artemis/app;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        include /etc/nginx/snippets/artemis-security-headers.conf;
    }

    # QA B-04 (31.10.2026): ONE Cache-Control. Was `expires -1` (adds "no-cache") + add_header
    # "no-store, ..." = two conflicting headers. "private, no-cache": browser may store, revalidates
    # (ETag/304) on every use, so a deploy is visible at once. "private" is needed: with plain
    # "no-cache" Cloudflare rewrote it to its zone Browser Cache TTL (max-age=14400).
    location /static/ {
        alias /var/www/artemis/app/static/;
        add_header Cache-Control "private, no-cache" always;
        include /etc/nginx/snippets/artemis-security-headers.conf;
    }

    # DISABLED 2026-10-31: legacy deploy webhook (artemis-hook.service disabled, :9001 dead).
    # Deploy = /usr/local/sbin/artemis-deploy.sh on the server. Old proxy block kept for history:
    #   location = /deploy-hook { proxy_pass http://127.0.0.1:9001/deploy-hook; ... limit_except POST { deny all; } }
    location = /deploy-hook {
        return 410;
    }

    # P09 temporary (31.10.2026): rate limit for the enquiry form. realip also at server level
    # so $binary_remote_addr is the real client before limit_req (preaccess).
    location = /api/enquiry {
        include /etc/nginx/snippets/cloudflare-realip.conf;
        limit_req zone=artemis_enquiry burst=6 nodelay;
        limit_req_status 429;
        limit_req_log_level warn;   # QA PR24-04: a rejected request is not an [error]
        # QA PR24-03: the form does `await r.json()`; answer the nginx 429 with the app's JSON shape.
        # Only nginx-generated 429s hit this (proxy_intercept_errors is off: app responses pass through).
        error_page 429 = @artemis_enquiry_429;
        proxy_pass http://127.0.0.1:8082;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header CF-Connecting-IP $remote_addr;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location @artemis_enquiry_429 {
        default_type application/json;
        include /etc/nginx/snippets/artemis-security-headers.conf;
        add_header Cache-Control "no-store" always;
        add_header Retry-After "60" always;
        return 429 '{"ok":false,"code":"rate_limited"}';
    }

    location / {
        proxy_pass http://127.0.0.1:8082;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        include /etc/nginx/snippets/cloudflare-realip.conf;
        proxy_set_header CF-Connecting-IP $remote_addr;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}

server {
    listen 185.216.214.28:80;
    listen 80;
    server_name artemisresort.com www.artemisresort.com;
    server_tokens off;
    # QA PR24-10: real client IP (not the CF edge) in access/error logs and for any future limit/deny here.
    include /etc/nginx/snippets/cloudflare-realip.conf;
    location ^~ /.well-known/acme-challenge/ { root /var/www/letsencrypt; default_type text/plain; }
    return 301 https://artemisresort.com$request_uri;
}

# QA A-08 (31.10.2026): www -> apex, one 301 hop, path + query kept (cert covers www).
server {
    listen 185.216.214.28:443 ssl http2;
    listen 443 ssl http2;
    server_name www.artemisresort.com;
    server_tokens off;
    # QA PR24-10: real client IP (not the CF edge) in access/error logs and for any future limit/deny here.
    include /etc/nginx/snippets/cloudflare-realip.conf;
    include /etc/nginx/snippets/artemis-security-headers.conf;
    ssl_certificate /etc/letsencrypt/live/artemisresort.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/artemisresort.com/privkey.pem;
    access_log /var/log/nginx/artemisresort.access.log;
    error_log  /var/log/nginx/artemisresort.error.log;
    location ^~ /.well-known/acme-challenge/ { root /var/www/letsencrypt; default_type text/plain; }
    location / { return 301 https://artemisresort.com$request_uri; }
}
