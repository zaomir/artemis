# artemisresort.com — CSP per path (task 4 SEO/security, 31.10.2026). Used only by
# sites-enabled/artemisresort.com.origin.conf via snippets/artemis-security-headers.conf.
# Install: /etc/nginx/conf.d/artemis-security-map.conf (http context), then nginx -t && reload.
#
# QA A-08 (31.10.2026): Crete pages (default) now get a CSP too. They use an inline <style>,
# style="" attributes, an inline <script> and onclick= handlers (app/templates/index.html, legal/*),
# so the narrowest working policy needs 'unsafe-inline' for script-src and style-src; everything
# else is same-origin only. Framing: same origin only (frame-ancestors 'self' + XFO SAMEORIGIN);
# Tenerife keeps frame-ancestors 'none' / XFO DENY.
# QA T3-09 / PR24-02 (31.10.2026): the site uses no analytics (privacy: "Сайт не использует аналитику"),
# so no policy allows static.cloudflareinsights.com / cloudflareinsights.com.
# Cloudflare Web Analytics / RUM for artemisresort.com was turned off by the owner ~21:30 UTC 31.10.2026
# (dashboard: Web Analytics > artemisresort.com > Real User Measurements = Disable). Checked with browser
# user agents: the edge no longer injects beacon.min.js / cloudflareinsights (evidence:
# /workspace/qa/artemis/2026-10-31_rum-off-check/ on the shared bots box).
# If RUM is ever re-enabled, this CSP will block the injected beacon (console CSP errors on every page)
# and the privacy text will become untrue: keep RUM off.
map $uri $artemis_csp {
    default "default-src 'self'; script-src 'self' 'unsafe-inline'; connect-src 'self'; img-src 'self' data:; style-src 'self' 'unsafe-inline'; font-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'self'; upgrade-insecure-requests";
    ~^/tenerife/ "default-src 'self'; script-src 'self'; connect-src 'self'; img-src 'self' data:; style-src 'self'; font-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'; upgrade-insecure-requests";
    ~^/tenerife-preview/ "default-src 'self'; script-src 'self' 'unsafe-inline'; connect-src 'self'; img-src 'self' data:; style-src 'self' 'unsafe-inline'; font-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'; upgrade-insecure-requests";
    ~^/api/tenerife/ "default-src 'none'; frame-ancestors 'none'";
}

map $uri $artemis_xfo {
    default "SAMEORIGIN";
    ~^/tenerife(-preview)?/ "DENY";
    ~^/api/tenerife/ "DENY";
}
