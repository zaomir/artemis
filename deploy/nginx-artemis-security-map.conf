# artemisresort.com — CSP per path (task 4 SEO/security, 31.10.2026). Used only by
# sites-enabled/artemisresort.com.origin.conf via snippets/artemis-security-headers.conf.
# Empty value = header not sent (Crete pages keep working without CSP).
map $uri $artemis_csp {
    default "";
    ~^/tenerife/ "default-src 'self'; script-src 'self' https://static.cloudflareinsights.com; connect-src 'self' https://cloudflareinsights.com; img-src 'self' data:; style-src 'self'; font-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'; upgrade-insecure-requests";
    ~^/tenerife-preview/ "default-src 'self'; script-src 'self' 'unsafe-inline' https://static.cloudflareinsights.com; connect-src 'self' https://cloudflareinsights.com; img-src 'self' data:; style-src 'self' 'unsafe-inline'; font-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'; upgrade-insecure-requests";
    ~^/api/tenerife/ "default-src 'none'; frame-ancestors 'none'";
}
