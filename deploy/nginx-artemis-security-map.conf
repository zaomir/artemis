# artemisresort.com — CSP per path (task 4 SEO/security, 31.10.2026). Used only by
# sites-enabled/artemisresort.com.origin.conf via snippets/artemis-security-headers.conf.
# Install: /etc/nginx/conf.d/artemis-security-map.conf (http context), then nginx -t && reload.
#
# QA A-08 (31.10.2026): Crete pages (default) now get a CSP too. They use an inline <style>,
# style="" attributes, an inline <script> and onclick= handlers (app/templates/index.html, legal/*),
# so the narrowest working policy needs 'unsafe-inline' for script-src and style-src; everything
# else is same-origin only. Framing: same origin only (frame-ancestors 'self' + XFO SAMEORIGIN);
# Tenerife keeps frame-ancestors 'none' / XFO DENY.
map $uri $artemis_csp {
    default "default-src 'self'; script-src 'self' 'unsafe-inline' https://static.cloudflareinsights.com; connect-src 'self' https://cloudflareinsights.com; img-src 'self' data:; style-src 'self' 'unsafe-inline'; font-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'self'; upgrade-insecure-requests";
    ~^/tenerife/ "default-src 'self'; script-src 'self' https://static.cloudflareinsights.com; connect-src 'self' https://cloudflareinsights.com; img-src 'self' data:; style-src 'self'; font-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'; upgrade-insecure-requests";
    ~^/tenerife-preview/ "default-src 'self'; script-src 'self' 'unsafe-inline' https://static.cloudflareinsights.com; connect-src 'self' https://cloudflareinsights.com; img-src 'self' data:; style-src 'self' 'unsafe-inline'; font-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'; upgrade-insecure-requests";
    ~^/api/tenerife/ "default-src 'none'; frame-ancestors 'none'";
}

map $uri $artemis_xfo {
    default "SAMEORIGIN";
    ~^/tenerife(-preview)?/ "DENY";
    ~^/api/tenerife/ "DENY";
}
