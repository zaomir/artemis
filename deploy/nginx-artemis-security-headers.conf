# artemisresort.com security headers (task 4, 31.10.2026). Include at server level AND in every
# location that has its own add_header (nginx does not inherit add_header into such locations).
# Install: /etc/nginx/snippets/artemis-security-headers.conf (needs the maps from
# nginx-artemis-security-map.conf), then nginx -t && reload.
add_header Strict-Transport-Security "max-age=31536000" always;
add_header X-Content-Type-Options "nosniff" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
add_header Content-Security-Policy $artemis_csp always;
# QA A-08 (31.10.2026): frame protection for every page, minimal Permissions-Policy site-wide.
add_header X-Frame-Options $artemis_xfo always;
add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
