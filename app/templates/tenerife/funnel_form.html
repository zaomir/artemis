<form id="wl-form" data-funnel-version="1" method="post" action="/api/tenerife/waitlist">
  <input type="hidden" name="submission_id" value="{{ submission_id }}">
  <input type="hidden" name="intent" value="{{ intent }}">
  <input type="hidden" name="page" value="{{ page }}">
  <input type="hidden" name="language" value="{{ locale }}">
{% for key,value in extras.items() %}<input type="hidden" name="{{ key }}" value="{{ value }}">{% endfor %}
{% if intent != 'newsletter_only' %}
  <div class="field"><label for="af-name">{{ labels.name }}</label><input id="af-name" name="name" autocomplete="name" required maxlength="120" value="{{ values.get('name','') }}"></div>
  <div class="field"><label for="af-kind">{{ labels.channel }}</label><select id="af-kind" name="contact_type"><option value="email"{% if kind == 'email' %} selected{% endif %}>Email</option><option value="facebook"{% if kind == 'facebook' %} selected{% endif %}>Facebook</option></select></div>
{% else %}
  <input type="hidden" name="contact_type" value="email">
{% endif %}
  <div class="field"><label for="af-contact">{{ 'Email' if intent == 'newsletter_only' else labels.contact }}</label><input id="af-contact" name="contact"{% if intent == 'newsletter_only' %} type="email"{% endif %} required maxlength="254" value="{{ values.get('contact','') }}"></div>
{% if intent != 'newsletter_only' %}
  <div class="field"><label for="af-newsletter">{{ labels.optional_email }}</label><input id="af-newsletter" name="newsletter_email" type="email" autocomplete="email" maxlength="254" value="{{ values.get('newsletter_email','') }}"></div>
{% endif %}
  <label class="check"><input type="checkbox" name="newsletter_opt_in"{% if intent == 'newsletter_only' %} required{% endif %}{% if opted %} checked{% endif %}> {{ labels.opt_in }}</label>
{% if intent != 'newsletter_only' %}
  <label class="check"><input type="checkbox" name="consent" required{% if consented %} checked{% endif %}> {{ labels.consent }} <a href="{{ privacy_url }}">{{ labels.privacy }}</a></label>
{% else %}
  <p><a href="{{ privacy_url }}">{{ labels.privacy }}</a></p>
{% endif %}
  <div class="hp" aria-hidden="true" hidden><label>Website<input name="website" tabindex="-1" autocomplete="off"></label></div>
  <button class="cta-primary" type="submit">{{ labels.subscribe if intent == 'newsletter_only' else labels.submit }}</button>
  <p role="status" id="af-status"></p>
</form>
